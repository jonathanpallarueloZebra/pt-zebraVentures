<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo-section">
      <img class="auth-logo" src="logo-cabrero.png" alt="Cabrero" />
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <h1 class="auth-title">Crear cuenta</h1>

      @if (error()) {
        <div class="auth-alert auth-alert--error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error() }}</span>
        </div>
      }

      <div class="auth-fields">
        <div class="auth-field">
          <label class="auth-label" for="email">Email</label>
          <input
            class="auth-input"
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@ejemplo.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="username">Usuario</label>
          <input
            class="auth-input"
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            placeholder="nombre_usuario"
            required
            autocomplete="username"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">Contraseña</label>
          <div class="auth-input-wrap">
            <input
              class="auth-input auth-input--icon"
              [type]="hidePassword ? 'password' : 'text'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="· · · · · ·"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button type="button" class="auth-input-toggle" (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="passwordConfirm">Confirmar contraseña</label>
          <div class="auth-input-wrap">
            <input
              class="auth-input auth-input--icon"
              [type]="hideConfirm ? 'password' : 'text'"
              id="passwordConfirm"
              [(ngModel)]="passwordConfirm"
              name="passwordConfirm"
              placeholder="· · · · · ·"
              required
              autocomplete="new-password"
            />
            <button type="button" class="auth-input-toggle" (click)="hideConfirm = !hideConfirm">
              <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <div class="auth-action">
        <button type="submit" class="auth-btn" [disabled]="loading()">
          @if (loading()) { Registrando... } @else { Registrarme }
        </button>
      </div>
    </form>

    <div class="auth-footer-row">
      <span class="auth-footer-text">¿Ya tienes cuenta?</span>
      <a class="auth-link" routerLink="/login">Inicia sesión</a>
    </div>

  </div>
</div>
