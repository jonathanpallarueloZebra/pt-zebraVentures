<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo-section">
      <!-- Logo de branding (subido a /media desde el panel, igual que el del
           navbar). Se espera a loaded() para no pintar el logo por defecto y
           reemplazarlo al llegar la respuesta.
           Sin logo configurado cae al de Zebra, no al de ningun cliente: esta
           misma imagen sirve a varios despliegues. -->
      @if (brandingService.loaded()) {
        <img class="auth-logo"
             [src]="brandingService.branding().logo_url || 'zebra-logo.svg'"
             [alt]="brandingService.branding().company_name || 'Zebra'" />
      }
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <h1 class="auth-title">Iniciar sesión</h1>

      @if (error()) {
        <div class="auth-alert auth-alert--error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error() }}</span>
        </div>
      }

      <div class="auth-fields">
        <div class="auth-field">
          <label class="auth-label" for="email">Usuario</label>
          <input
            class="auth-input"
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Usuario"
            required
            autocomplete="email"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">Contraseña</label>
          <div class="auth-input-wrap">
            <input
              class="auth-input auth-input--icon"
              [type]="hidePassword ? 'password' : 'text'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="· · · · · ·"
              required
              autocomplete="current-password"
            />
            <button type="button" class="auth-input-toggle" (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <div class="auth-forgot-row">
        <a class="auth-link" routerLink="/forgot-password">Recuperar contraseña</a>
      </div>

      <div class="auth-action">
        <button type="submit" class="auth-btn" [disabled]="loading()">
          @if (loading()) {
            <svg class="auth-btn__spinner" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.8402 7C11.8402 7.92073 11.6018 8.82573 11.1484 9.627C10.6948 10.4283 10.0416 11.0985 9.2523 11.5725C8.4629 12.0464 7.5643 12.3079 6.6439 12.3316C5.7235 12.3552 4.81265 12.1402 4 11.7075" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Entrando...</span>
          } @else { Entrar }
        </button>
      </div>
    </form>

  </div>
</div>
