# Construye las imágenes, las publica en GitHub Container Registry (ghcr.io) y
# lanza el despliegue en arcis.
#
# QA:          cada push a la rama `staging` lo despliega solo.
# PRODUCCIÓN:  solo al publicar un tag `X.Y.Z-prod`.
#
#     git switch staging && git merge mi-rama && git push    # -> QA
#     git tag 1.0.0-prod && git push origin 1.0.0-prod       # -> producción
#
# Producción no se despliega al hacer merge a propósito: se publica cuando
# alguien decide que una versión ya probada en QA debe salir.
#
# El registry es ghcr.io, no el Artifact Registry de Google que usan adea y la
# mayoría: así no hace falta cuenta de servicio de GCP, y para publicar basta
# el GITHUB_TOKEN que Actions ya proporciona.
#
# El namespace es la CUENTA PERSONAL, no la organizacion `zebra-ventures`
# (donde si publica bodjav). Publicar ahi devolvia
# `denied: permission_denied: The requested installation does not exist`:
# el GITHUB_TOKEN de este repo no tiene permiso sobre los paquetes de esa
# organizacion. Si algun dia el proyecto pasa a ella, basta cambiar REGISTRO
# aqui y en los dos composes.
#
# Secretos que hay que dar de alta en el repositorio (Settings > Secrets):
#   SSH_PRIVATE_KEY  Clave privada cuya pública está en el authorized_keys de
#                    arcis, restringida con
#                    command="/opt/docker/projects/ptzebra/desplegar.sh".
#   SSH_HOST         IP o nombre de arcis.
#   SSH_USER         Usuario con el que se entra (root).
#
# GITHUB_TOKEN no hay que crearlo: lo inyecta Actions en cada ejecución.

name: Desplegar

on:
  # QA se despliega sola en cada push a `staging`: es la rama de integracion y
  # lo que hay ahi es lo que marketing y el equipo ven en QA.
  push:
    branches:
      - staging
    # Produccion NO se despliega al hacer merge: se publica a proposito, con un
    # tag `X.Y.Z-prod` de una version ya probada en QA.
    #
    # Son patrones glob, no expresiones regulares: `*` casa cualquier cosa
    # menos `/`, y no existe el `+` de las regex. El formato X.Y.Z lo valida
    # desplegar.sh en el servidor, que si usa regex y aborta si el sufijo del
    # tag no corresponde al entorno.
    tags:
      - '*-prod'

env:
  REGISTRO: ghcr.io/jonathanpallaruelozebra/ptzebra

jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para que el GITHUB_TOKEN pueda publicar en ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Cada entorno tira de imagenes con nombre distinto (backend-qa vs
      # backend), y desplegar.sh exige un tag X.Y.Z-<entorno>: aborta si el
      # sufijo no corresponde al entorno que se le pasa.
      - name: Deducir entorno y version
        id: entorno
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Produccion: la version la pone quien publica el tag.
            TAG="${GITHUB_REF_NAME}"
            ENTORNO="${TAG##*-}"
            echo "imagen_backend=backend"   >> "$GITHUB_OUTPUT"
            echo "imagen_frontend=frontend" >> "$GITHUB_OUTPUT"
          else
            # QA desde `staging`: no hay version que leer, asi que se compone
            # con el numero de ejecucion, que crece solo y nunca se repite. Sin
            # esto el tag no cambiaria entre despliegues y el servidor no se
            # traeria la imagen nueva.
            ENTORNO="qa"
            TAG="0.1.${GITHUB_RUN_NUMBER}-qa"
            echo "imagen_backend=backend-qa"   >> "$GITHUB_OUTPUT"
            echo "imagen_frontend=frontend-qa" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "entorno=$ENTORNO" >> "$GITHUB_OUTPUT"
          echo "Desplegando $TAG en $ENTORNO"

      - name: Autenticar contra ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar el backend
        run: |
          IMAGEN="${{ env.REGISTRO }}/${{ steps.entorno.outputs.imagen_backend }}:${{ steps.entorno.outputs.tag }}"
          docker build -t "$IMAGEN" ./backend
          docker push "$IMAGEN"

      # Dockerfile-compose es el único válido: compila con la configuración
      # `docker` (apiUrl relativo '/api') y su nginx hace de proxy hacia
      # BACKEND_HOST. Los composes lo necesitan porque el backend no está
      # expuesto por Traefik.
      - name: Construir y publicar el frontend
        run: |
          IMAGEN="${{ env.REGISTRO }}/${{ steps.entorno.outputs.imagen_frontend }}:${{ steps.entorno.outputs.tag }}"
          docker build -f ./frontend/Dockerfile-compose -t "$IMAGEN" ./frontend
          docker push "$IMAGEN"

      # La clave está restringida con `command=` en el servidor: mande lo que
      # mande esto, arcis solo ejecuta desplegar.sh. Los argumentos llegan por
      # SSH_ORIGINAL_COMMAND.
      - name: Desplegar en arcis
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "${{ steps.entorno.outputs.entorno }} ${{ steps.entorno.outputs.tag }} ${GITHUB_SHA::7}"
