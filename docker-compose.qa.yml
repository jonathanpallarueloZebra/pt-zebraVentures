# Despliegue de QA en el servidor de Arcis.
#
# Este fichero NO construye nada: usa las imágenes ya publicadas en el registry,
# se conecta al Postgres que ya corre en el servidor y no ocupa el puerto 80
# (ahí está Traefik, que hace de proxy y termina TLS).
#
# Uso:
#
#   docker compose -f docker-compose.qa.yml --env-file .env.qa pull
#   docker compose -f docker-compose.qa.yml --env-file .env.qa up -d
#
# Ver DESPLIEGUE.md para los pasos completos.

name: ptzebra-qa

services:
  backend:
    image: ${REGISTRO:-europe-southwest1-docker.pkg.dev/admin-zebra/ptzebra-apps}/backend-qa:${VERSION:-latest}
    # Nombre fijo, convención proyecto-pieza-entorno, para poder localizarlo
    # entre los muchos contenedores del servidor.
    container_name: ptzebra-backend-qa
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-qa}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en el fichero .env.qa}
      # QA y PRODUCCIÓN tienen BASES SEPARADAS: esta apunta a la de QA.
      DB_NAME: ${DB_NAME:?define DB_NAME en el fichero .env.qa}
      DB_USER: ${DB_USER:?define DB_USER en el fichero .env.qa}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el fichero .env.qa}
      DB_HOST: ${DB_HOST:?define DB_HOST en el fichero .env.qa}
      DB_PORT: ${DB_PORT:-5432}
      # settings.py añade siempre '.zebraventures.eu' (comodín de subdominio),
      # 'localhost' y '127.0.0.1'. Se listan aquí los hosts internos.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-ptzebra-backend-qa,localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-https://ptzebra-qa.zebraventures.eu}
      # El agente de chat necesita AGENT_MODEL; sin ella responde 503 (ya no
      # tumba la API entera, pero el chat queda inoperativo).
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_PERSONALITY: ${AGENT_PERSONALITY:-}
      # Qué está desplegado, para poder verificarlo sin entrar al contenedor.
      VERSION: ${VERSION:-}
      COMMIT: ${COMMIT:-}
    volumes:
      # Logos y favicons que sube el cliente desde /branding. Viven en el
      # servidor, no en la imagen: un despliegue nuevo no se los lleva por delante.
      - medios:/app/media
    # En `proxy` porque es donde vive el frontend, que es quien le habla. Sin
    # `ports` y con traefik.enable=false: no queda accesible desde fuera, solo
    # por nombre dentro de la red.
    #
    # NO declarar un alias `backend` aquí: `proxy` es una red compartida con
    # muchos contenedores de otros proyectos y ese nombre ya está cogido. El
    # frontend resuelve por `ptzebra-backend-qa`, que es único (ver NOMBRE_BACKEND).
    networks:
      - proxy
    labels:
      traefik.enable: "false"
    # Las migraciones las aplica el entrypoint de la imagen antes de arrancar
    # uvicorn (docker-entrypoint.sh), con reintentos mientras la BD no acepte
    # conexiones. No hace falta un `command` propio.

  frontend:
    image: ${REGISTRO:-europe-southwest1-docker.pkg.dev/admin-zebra/ptzebra-apps}/frontend-qa:${VERSION:-latest}
    container_name: ptzebra-frontend-qa
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # El nginx de esta imagen hace de proxy de /api/ hacia este host. Es el
      # NOMBRE DEL CONTENEDOR, no el del servicio: en la red compartida `proxy`
      # un nombre como `backend` ya pertenece a otro proyecto y acabaríamos
      # preguntando al Django de otro (que responde 400 por ALLOWED_HOSTS).
      BACKEND_HOST: ptzebra-backend-qa
    # Sin `ports`: Traefik llega por la red `proxy`, no hace falta abrir nada
    # en la máquina.
    #
    # Solo en `proxy`: con una segunda red, Traefik 2.10 descarta el contenedor
    # sin registrar nada en su log (ni router, ni error: simplemente no existe).
    networks:
      - proxy
    # `wget --spider` falla en la nginx de Alpine y un contenedor `unhealthy` lo
    # descarta Traefik sin dejar rastro. Se usa curl, como el resto del servidor.
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:80/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Su nginx ya hace de pasarela a /api/ y /media/, así que todo entra por un
    # solo dominio y no hace falta CORS.
    #
    # Dos routers, como el resto de servicios del servidor: uno en `web` que
    # redirige a https y otro en `websecure` que sirve el sitio.
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy

      # HTTP: solo existe para mandar al visitante a https.
      traefik.http.routers.ptzebra_frontend_qa-http.rule: Host(`ptzebra-qa.zebraventures.eu`)
      traefik.http.routers.ptzebra_frontend_qa-http.entrypoints: web
      traefik.http.routers.ptzebra_frontend_qa-http.middlewares: ptzebra_frontend_qa-redirect
      traefik.http.middlewares.ptzebra_frontend_qa-redirect.redirectscheme.scheme: https

      # HTTPS: el sitio, con el certificado que pide Let's Encrypt.
      traefik.http.routers.ptzebra_frontend_qa.rule: Host(`ptzebra-qa.zebraventures.eu`)
      traefik.http.routers.ptzebra_frontend_qa.entrypoints: websecure
      traefik.http.routers.ptzebra_frontend_qa.tls.certresolver: myresolver
      traefik.http.routers.ptzebra_frontend_qa.middlewares: secure-headers-ptzebra_frontend_qa
      traefik.http.services.ptzebra_frontend_qa.loadbalancer.server.port: "80"

      # Cabeceras de seguridad, como en el resto de los servicios.
      traefik.http.middlewares.secure-headers-ptzebra_frontend_qa.headers.browserXssFilter: "true"
      traefik.http.middlewares.secure-headers-ptzebra_frontend_qa.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.secure-headers-ptzebra_frontend_qa.headers.forceSTSHeader: "true"
      traefik.http.middlewares.secure-headers-ptzebra_frontend_qa.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.secure-headers-ptzebra_frontend_qa.headers.stsSeconds: "31536000"

networks:
  # La red compartida donde vive Traefik. Ya existe en el servidor: este
  # compose se conecta a ella, no la crea ni la modifica.
  proxy:
    external: true

volumes:
  medios:
